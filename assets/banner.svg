<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e21" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Embedded CSS Animation -->
    <style>
      .pulse-glow {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-1 {
        animation: floatOne 6s ease-in-out infinite alternate;
      }
      .float-2 {
        animation: floatTwo 7s ease-in-out infinite alternate;
      }
      .dash-anim {
        stroke-dasharray: 8, 8;
        animation: dash 20s linear infinite;
      }
      .bar-grow-1 {
        animation: grow1 3s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      .bar-grow-2 {
        animation: grow2 3.5s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      .bar-grow-3 {
        animation: grow3 4s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      .shimmer {
        animation: shimmerText 5s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes floatOne {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes floatTwo {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes grow1 {
        0% { transform: scaleY(0.7); }
        100% { transform: scaleY(1.05); }
      }
      @keyframes grow2 {
        0% { transform: scaleY(0.85); }
        100% { transform: scaleY(1.15); }
      }
      @keyframes grow3 {
        0% { transform: scaleY(0.65); }
        100% { transform: scaleY(1.1); }
      }
      @keyframes shimmerText {
        0% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
        100% { filter: drop-shadow(0 0 25px rgba(192, 132, 252, 0.8)); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Background Orbs -->
  <circle cx="150" cy="80" r="180" fill="#38bdf8" opacity="0.15" filter="url(#glow-soft)" class="pulse-glow" />
  <circle cx="1050" cy="280" r="220" fill="#818cf8" opacity="0.15" filter="url(#glow-soft)" class="pulse-glow" />
  <circle cx="600" cy="180" r="140" fill="#c084fc" opacity="0.08" filter="url(#glow-soft)" />

  <!-- Left Side: Interactive CPM / Financial Metrics Dashboard Graphic -->
  <g class="float-1" transform="translate(60, 50)">
    <!-- Main Card -->
    <rect width="260" height="250" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <rect width="260" height="40" rx="14" fill="#1e293b" fill-opacity="0.5" />
    
    <!-- Window controls -->
    <circle cx="20" cy="20" r="5" fill="#ef4444" />
    <circle cx="36" cy="20" r="5" fill="#f59e0b" />
    <circle cx="52" cy="20" r="5" fill="#10b981" />
    <text x="75" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ENTERPRISE CPM • FP&amp;A</text>

    <!-- Mini KPI stats -->
    <text x="20" y="65" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">ACTUAL VS BUDGET</text>
    <text x="20" y="88" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">+124.8%</text>
    <path d="M 120 78 L 135 68 L 150 72 L 170 58" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Mini Bar Chart (Animated) -->
    <g transform="translate(20, 220)">
      <!-- Base Line -->
      <line x1="0" y1="0" x2="220" y2="0" stroke="#475569" stroke-width="1.5" />
      
      <!-- Bars -->
      <rect x="10" y="-70" width="18" height="70" rx="4" fill="#38bdf8" fill-opacity="0.85" class="bar-grow-1" />
      <rect x="40" y="-95" width="18" height="95" rx="4" fill="#818cf8" fill-opacity="0.85" class="bar-grow-2" />
      <rect x="70" y="-60" width="18" height="60" rx="4" fill="#38bdf8" fill-opacity="0.85" class="bar-grow-3" />
      <rect x="100" y="-115" width="18" height="115" rx="4" fill="#c084fc" fill-opacity="0.9" class="bar-grow-1" />
      <rect x="130" y="-85" width="18" height="85" rx="4" fill="#818cf8" fill-opacity="0.85" class="bar-grow-2" />
      <rect x="160" y="-130" width="18" height="130" rx="4" fill="#06b6d4" fill-opacity="0.9" class="bar-grow-3" />
      <rect x="190" y="-105" width="18" height="105" rx="4" fill="#a855f7" fill-opacity="0.85" class="bar-grow-1" />
    </g>

    <!-- Overlay Forecast Line -->
    <path d="M 30 180 Q 80 140, 130 155 T 230 100" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" class="dash-anim" />
    <circle cx="230" cy="100" r="5" fill="#fbbf24" filter="url(#glow-cyan)" />
  </g>

  <!-- Right Side: Connected Planning & Consolidation Nodes Graphic -->
  <g class="float-2" transform="translate(890, 45)">
    <!-- Background Card -->
    <rect width="250" height="260" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <rect width="250" height="40" rx="14" fill="#1e293b" fill-opacity="0.5" />
    <text x="20" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">MULTI-ENTITY CONSOLIDATION</text>

    <!-- Connecting Network Lines -->
    <line x1="60" y1="100" x2="125" y2="155" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4,4" />
    <line x1="190" y1="100" x2="125" y2="155" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4,4" />
    <line x1="60" y1="210" x2="125" y2="155" stroke="#c084fc" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4,4" />
    <line x1="190" y1="210" x2="125" y2="155" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4,4" />

    <!-- Central Node: Consolidation / General Ledger -->
    <circle cx="125" cy="155" r="28" fill="#1e293b" stroke="url(#primary-grad)" stroke-width="3" filter="url(#glow-cyan)" />
    <text x="125" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">EPM</text>
    <text x="125" y="164" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">CORE</text>

    <!-- Satellite Nodes -->
    <!-- Node 1: ERP / Actuals -->
    <circle cx="60" cy="100" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="60" y="103" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ERP</text>
    
    <!-- Node 2: Budgeting & Plan -->
    <circle cx="190" cy="100" r="20" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    <text x="190" y="103" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PLAN</text>

    <!-- Node 3: AI / Forecast -->
    <circle cx="60" cy="210" r="20" fill="#0f172a" stroke="#c084fc" stroke-width="2" />
    <text x="60" y="213" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">AI / ML</text>

    <!-- Node 4: Reporting / BI -->
    <circle cx="190" cy="210" r="20" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <text x="190" y="213" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">BI / SEC</text>
  </g>

  <!-- Center Content: Title, Badges, Tagline -->
  <g transform="translate(360, 65)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="14" cy="14" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM MAP</text>

    <!-- Main Title -->
    <text x="0" y="70" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" class="shimmer">
      Awesome Corporate
    </text>
    <text x="0" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      Performance Management
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="150" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
      Enterprise Planning • FP&amp;A • Financial Consolidation • Budgeting • BI
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 175)">
      <!-- Badge 1: SaaS Suites -->
      <rect x="0" y="0" width="105" height="30" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="52.5" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">☁️ SaaS Suites</text>

      <!-- Badge 2: Open Source -->
      <rect x="115" y="0" width="125" height="30" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="177.5" y="19" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ Open-Source</text>

      <!-- Badge 3: Pricing & Trials -->
      <rect x="250" y="0" width="125" height="30" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="312.5" y="19" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">💰 Pricing &amp; Trials</text>

      <!-- Badge 4: AI & Forecasting -->
      <rect x="385" y="0" width="125" height="30" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
      <text x="447.5" y="19" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🔮 AI &amp; Forecast</text>
    </g>
  </g>

  <!-- Border Gradient Accent -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#primary-grad)" stroke-width="1.5" stroke-opacity="0.4" />
</svg>
